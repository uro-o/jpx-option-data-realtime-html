name: Update JPX Option Data

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * 1-5"

concurrency:
  group: jpx-option-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-option-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Get JPX option data
        run: |
          echo "========================================"
          echo "GET JPX OPTION DATA"
          echo "========================================"
          python run_option_data.py

      - name: Check data files
        run: |
          echo "========================================"
          echo "DATA FILES"
          echo "========================================"
          find data -maxdepth 3 -type f -print | sort
          echo ""
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"
          git status --short

      - name: Commit and push
        run: |
          echo "========================================"
          echo "COMMIT AND PUSH"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git status --short
            git commit -m "Update JPX option data"

            git fetch origin main

            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Remote is already up to date."
            else
              echo "Remote has newer commits."
              git reset --soft origin/main
              git add data/

              if git diff --cached --quiet; then
                echo "No local data changes after sync."
              else
                git commit -m "Update JPX option data"
              fi
            fi

            git push origin HEAD:main
          fi

      - name: Finished
        run: |
          echo "========================================"
          echo "JPX OPTION DATA UPDATE FINISHED"
          echo "========================================"
          date
