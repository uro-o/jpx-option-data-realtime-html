name: Update JPX Option Data

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * 1-5"

concurrency:
  group: jpx-option-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-option-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Get JPX option data
        run: |
          echo "========================================"
          echo "GET JPX OPTION DATA"
          echo "========================================"
          python get_option_data.py

      - name: Remove expired option contracts
        run: |
          echo "========================================"
          echo "REMOVE EXPIRED OPTION CONTRACTS"
          echo "========================================"

          python - <<'PY'
          import csv
          import re
          import calendar
          from datetime import date, timedelta, timezone, datetime
          from pathlib import Path

          path = Path("data/latest.csv")
          JST = timezone(timedelta(hours=9))
          today = datetime.now(JST).date()

          def last_trading_day(contract):
              m = re.fullmatch(r"(\\d{4})-(\\d{2})", str(contract).strip())
              if not m:
                  return None

              year = int(m.group(1))
              month = int(m.group(2))
              cal = calendar.monthcalendar(year, month)
              fridays = [week[calendar.FRIDAY] for week in cal if week[calendar.FRIDAY]]
              if len(fridays) < 2:
                  return None

              sq_day = date(year, month, fridays[1])
              last_day = sq_day - timedelta(days=1)

              while last_day.weekday() >= 5:
                  last_day -= timedelta(days=1)

              return last_day

          if not path.exists():
              print("latest.csv not found")
              raise SystemExit(0)

          with path.open("r", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames or []
              rows = list(reader)

          active_rows = []
          removed_contracts = set()

          for row in rows:
              contract = (row.get("contract") or "").strip()
              expiry = last_trading_day(contract)

              if expiry is not None and expiry < today:
                  removed_contracts.add(contract)
                  continue

              active_rows.append(row)

          if removed_contracts:
              with path.open("w", encoding="utf-8-sig", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(active_rows)

              print(f"Today (JST): {today}")
              print("Removed expired contracts:")
              for contract in sorted(removed_contracts):
                  print(f"  - {contract} (expired)")
          else:
              print(f"Today (JST): {today}")
              print("No expired contracts found.")

          print(f"Remaining records: {len(active_rows)}")
          PY

      - name: Calculate differences and send Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "========================================"
          echo "CALCULATE DIFFERENCES"
          echo "========================================"
          python calculate_difference.py

      - name: Check data files
        run: |
          echo "========================================"
          echo "DATA FILES"
          echo "========================================"
          find data -maxdepth 2 -type f -print | sort
          echo ""
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"
          git status --short

      - name: Commit and push
        run: |
          echo "========================================"
          echo "COMMIT AND PUSH"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git status --short
            git commit -m "Update JPX option data"

            git fetch origin main

            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Remote is already up to date."
            else
              echo "Remote has newer commits."
              git reset --soft origin/main
              git add data/

              if git diff --cached --quiet; then
                echo "No local data changes after sync."
              else
                git commit -m "Update JPX option data"
              fi
            fi

            git push origin HEAD:main
          fi

      - name: Finished
        run: |
          echo "========================================"
          echo "JPX OPTION DATA UPDATE FINISHED"
          echo "========================================"
          date
