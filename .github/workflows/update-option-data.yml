name: Update JPX Option Data

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * 1-5"


# ============================================================
# 同じWorkflowを同時実行させない
# ============================================================

concurrency:
  group: jpx-option-data
  cancel-in-progress: false


permissions:
  contents: write


jobs:

  update-option-data:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install requests beautifulsoup4


      # ======================================================
      # Get JPX data
      # ======================================================

      - name: Get JPX option data
        run: |

          echo "========================================"
          echo "GET JPX OPTION DATA"
          echo "========================================"

          python get_option_data.py


      # ======================================================
      # Remove expired contracts
      # ======================================================

      - name: Remove expired option contracts
        run: |

          echo "========================================"
          echo "REMOVE EXPIRED OPTION CONTRACTS"
          echo "========================================"

          python - <<'PY'
          import csv
          import re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path("data/latest.csv")

          JST = timezone(timedelta(hours=9))
          today = datetime.now(JST).date()

          if not path.exists():
              print("latest.csv not found")
              raise SystemExit(0)

          with path.open("r", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames or []
              rows = list(reader)

          if "last_trading_day" not in fieldnames:
              print("last_trading_day column not found; skipping cleanup")
              raise SystemExit(0)

          active_rows = []
          removed_contracts = set()

          for row in rows:
              last_day_text = (row.get("last_trading_day") or "").strip()
              last_day = None

              match = re.search(r"(\\d{4})/(\\d{1,2})/(\\d{1,2})", last_day_text)
              if match:
                  last_day = datetime(
                      int(match.group(1)),
                      int(match.group(2)),
                      int(match.group(3)),
                  ).date()

              # 取引最終日を過ぎた限月はlatest.csvから除外
              if last_day is not None and last_day < today:
                  removed_contracts.add(row.get("contract", ""))
                  continue

              active_rows.append(row)

          if removed_contracts:
              with path.open("w", encoding="utf-8-sig", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(active_rows)

              print(f"Today (JST): {today}")
              print("Removed expired contracts:")
              for contract in sorted(removed_contracts):
                  print(f"  - {contract}")
          else:
              print(f"Today (JST): {today}")
              print("No expired contracts found.")

          print(f"Remaining records: {len(active_rows)}")
          PY


      # ======================================================
      # Calculate differences + Discord
      # ======================================================

      - name: Calculate differences and send Discord
        env:

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |

          echo "========================================"
          echo "CALCULATE DIFFERENCES"
          echo "========================================"

          python calculate_difference.py


      # ======================================================
      # Check files
      # ======================================================

      - name: Check data files
        run: |

          echo "========================================"
          echo "DATA FILES"
          echo "========================================"

          find data -maxdepth 2 -type f -print | sort

          echo ""

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # ======================================================
      # Commit and push
      # ======================================================

      - name: Commit and push
        run: |

          echo "========================================"
          echo "COMMIT AND PUSH"
          echo "========================================"


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/


          if git diff --cached --quiet; then

            echo ""
            echo "No changes to commit."
            echo ""

          else

            echo ""
            echo "Changes detected."
            echo ""

            git status --short

            echo ""


            git commit \
              -m "Update JPX option data"


            echo ""
            echo "Fetching latest main..."
            echo ""

            git fetch origin main


            echo ""
            echo "Checking remote changes..."
            echo ""


            # ------------------------------------------------
            # リモートに新しいコミットがある場合
            #
            # データファイルは今回取得したものを優先
            # ------------------------------------------------

            if git merge-base --is-ancestor HEAD origin/main; then

              echo "Remote is already up to date."

            else

              echo "Remote has newer commits."

              echo "Resetting to remote main..."

              git reset --soft origin/main

              echo ""

              echo "Restaging data..."

              git add data/


              if git diff --cached --quiet; then

                echo ""
                echo "No local data changes after sync."
                echo ""

              else

                echo ""
                echo "Creating combined commit..."

                git commit \
                  -m "Update JPX option data"

              fi

            fi


            echo ""
            echo "Pushing to main..."
            echo ""

            git push origin HEAD:main


            echo ""
            echo "Push completed."
            echo ""

          fi


      # ======================================================
      # Finish
      # ======================================================

      - name: Finished
        run: |

          echo ""

          echo "========================================"

          echo "JPX OPTION DATA UPDATE FINISHED"

          echo "========================================"

          echo ""

          echo "Time:"

          date

          echo ""

          echo "Repository:"

          echo "${GITHUB_REPOSITORY}"

          echo ""

          echo "Branch:"

          echo "${GITHUB_REF_NAME}"

          echo ""

          echo "========================================"
