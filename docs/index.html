<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>日経225オプション需給モニター</title>


<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f3f4f6;
    color: #1f2937;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        "Yu Gothic",
        Meiryo,
        sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    background: #111827;
    color: white;
    padding: 12px 16px;
}

.header-inner {
    max-width: 1600px;
    margin: 0 auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 20px;
    font-weight: 700;
}

.subtitle {
    margin-top: 3px;
    color: #9ca3af;
    font-size: 11px;
}

.update-info {
    text-align: right;
    font-size: 11px;
    line-height: 1.5;
    color: #d1d5db;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
    max-width: 1600px;
    margin: 8px auto 0;
    padding: 0 10px;
}

.control-box {
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 6px;

    padding: 7px 10px;

    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}

.control-group {
    display: flex;
    align-items: center;
    gap: 5px;
}

.control-label {
    font-size: 11px;
    font-weight: 700;
}

select,
button {
    border: 1px solid #cbd5e1;
    background: white;
    border-radius: 4px;

    padding: 5px 8px;

    font-size: 11px;
    color: #1f2937;

    cursor: pointer;
}


/* =========================================================
   MAX PAIN
========================================================= */

.max-pain-box {
    background: #fff7ed;
    border: 1px solid #fdba74;
    border-radius: 6px;

    padding: 6px 12px;

    display: flex;
    align-items: center;
    gap: 8px;
}

.max-pain-label {
    color: #9a3412;
    font-size: 10px;
    font-weight: 700;
}

.max-pain-value {
    color: #ea580c;
    font-size: 17px;
    font-weight: 800;
}


/* =========================================================
   MARKET INFO
========================================================= */

.market-info {
    max-width: 1600px;
    margin: 8px auto;
    padding: 0 10px;
}

.market-box {
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 6px;

    padding: 8px 12px;

    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 25px;
}

.market-item {
    display: flex;
    flex-direction: column;
}

.market-label {
    color: #6b7280;
    font-size: 9px;
}

.market-value {
    font-size: 16px;
    font-weight: 700;
}

.market-small {
    font-size: 13px;
}


/* =========================================================
   CHART
========================================================= */

.chart-wrapper {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 10px 20px;
}

.chart-container {
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 6px;

    overflow-x: auto;
    overflow-y: visible;
}


/* =========================================================
   FIXED HEADER
========================================================= */

.chart-header {

    display: grid;

    grid-template-columns:
        minmax(140px, 1fr)
        minmax(140px, 1fr)
        95px
        minmax(140px, 1fr)
        minmax(140px, 1fr);

    min-width: 750px;

    background: #f8fafc;

    border-bottom: 2px solid #111827;

    position: sticky;

    top: 0;

    z-index: 100;
}

.chart-header > div {

    padding: 7px 4px;

    text-align: center;

    font-size: 10px;

    font-weight: 700;
}

.call-header {
    color: #dc2626;
}

.put-header {
    color: #2563eb;
}

.strike-header {

    color: #111827;

    border-left: 1px solid #d1d5db;

    border-right: 1px solid #d1d5db;
}


/* =========================================================
   CHART BODY
========================================================= */

#chart {
    min-width: 750px;
}


/* =========================================================
   ROW
========================================================= */

.option-row {

    display: grid;

    grid-template-columns:
        minmax(140px, 1fr)
        minmax(140px, 1fr)
        95px
        minmax(140px, 1fr)
        minmax(140px, 1fr);

    height: 32px;

    border-bottom: 1px solid #edf0f3;

    align-items: center;
}

.option-row:hover {
    background: #f8fafc;
}


/* =========================================================
   BAR CELL
========================================================= */

.bar-cell {

    position: relative;

    height: 32px;

    padding: 0 4px;

    display: flex;

    align-items: center;
}

.bar-area {

    position: relative;

    width: 100%;

    height: 22px;
}


/* =========================================================
   BAR
========================================================= */

.bar {

    position: absolute;

    top: 3px;

    height: 16px;

    border-radius: 2px;

    transition:
        width 0.2s ease;
}


/* ---------------------------------------------------------
   CALL
--------------------------------------------------------- */

/*
   CALLは右側へ伸ばす
*/

.call-volume .bar {
    right: 0;
    background: #fca5a5;
}

.call-oi .bar {
    right: 0;
    background: #dc2626;
}


/* ---------------------------------------------------------
   PUT
--------------------------------------------------------- */

/*
   PUTは左側へ伸ばす
*/

.put-oi .bar {
    left: 0;
    background: #2563eb;
}

.put-volume .bar {
    left: 0;
    background: #93c5fd;
}


/* =========================================================
   VALUE
========================================================= */

.bar-value {

    position: absolute;

    top: 0;

    height: 22px;

    display: flex;

    align-items: center;

    z-index: 3;

    font-size: 9px;

    font-weight: 600;

    white-space: nowrap;
}


/* CALL */

.call-volume .bar-value,
.call-oi .bar-value {
    right: 4px;
}


/* PUT */

.put-oi .bar-value,
.put-volume .bar-value {
    left: 4px;
}


/* CALL colors */

.call-volume .bar-value {
    color: #991b1b;
}

.call-oi .bar-value {
    color: white;
}


/* PUT colors */

.put-oi .bar-value {
    color: white;
}

.put-volume .bar-value {
    color: #1e3a8a;
}


/* =========================================================
   STRIKE
========================================================= */

.strike {

    position: relative;

    height: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: white;

    border-left: 1px solid #d1d5db;

    border-right: 1px solid #d1d5db;

    font-size: 10px;

    font-weight: 700;
}


/* =========================================================
   MAX PAIN
========================================================= */

.max-pain-row {
    background: #fff7ed;
}

.max-pain-row .strike {

    background: #ffedd5;

    color: #ea580c;

    border-top: 2px solid #f97316;

    border-bottom: 2px solid #f97316;
}

.max-pain-marker {

    position: absolute;

    right: 3px;

    top: 1px;

    font-size: 7px;

    color: #ea580c;
}


/* =========================================================
   LEGEND
========================================================= */

.legend {

    padding: 7px 12px;

    display: flex;

    flex-wrap: wrap;

    gap: 15px;

    border-top: 1px solid #e5e7eb;

    color: #6b7280;

    font-size: 9px;
}

.legend-item {

    display: flex;

    align-items: center;

    gap: 4px;
}

.legend-color {

    width: 15px;

    height: 8px;

    border-radius: 2px;
}

.legend-call-volume {
    background: #fca5a5;
}

.legend-call-oi {
    background: #dc2626;
}

.legend-put-oi {
    background: #2563eb;
}

.legend-put-volume {
    background: #93c5fd;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    padding: 40px 15px;

    text-align: center;

    color: #6b7280;

    font-size: 12px;
}

.message.error {
    color: #dc2626;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .title {
        font-size: 17px;
    }

    .subtitle {
        font-size: 9px;
    }

    .update-info {
        font-size: 9px;
    }

    .market-box {
        gap: 15px;
    }

    .chart-header,
    .option-row {

        grid-template-columns:
            120px
            120px
            75px
            120px
            120px;
    }

    #chart,
    .chart-header {

        min-width: 555px;
    }

}

</style>

</head>

<script>

/* =========================================================
   DATA URL
========================================================= */

const DATA_URL =
    "https://raw.githubusercontent.com/" +
    "uro-o/jpx-option-data-realtime-html/" +
    "main/data/latest.csv";


/* =========================================================
   STATE
========================================================= */

let allData = [];

let selectedContract = "";

let maxPain = null;


/* =========================================================
   DOM
========================================================= */

const chart =
    document.getElementById(
        "chart"
    );

const contractSelect =
    document.getElementById(
        "contractSelect"
    );

const rangeSelect =
    document.getElementById(
        "rangeSelect"
    );

const reloadButton =
    document.getElementById(
        "reloadButton"
    );


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];


        if (
            char === '"' &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);


            if (
                row.some(
                    v => v !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);

        rows.push(row);

    }


    if (
        rows.length === 0
    ) {

        return [];

    }


    const headers =
        rows[0].map(
            h => h.trim()
        );


    return rows
        .slice(1)
        .map(row => {

            const obj = {};


            headers.forEach(
                (header, i) => {

                    obj[header] =
                        row[i] !== undefined
                            ? row[i].trim()
                            : "";

                }
            );


            return obj;

        });

}


/* =========================================================
   NUMBER
========================================================= */

function num(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    const n =
        Number(
            String(value)
                .replace(/,/g, "")
                .trim()
        );


    return Number.isFinite(n)
        ? n
        : 0;

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value) {

    return Math.round(
        value
    ).toLocaleString(
        "ja-JP"
    );

}


/* =========================================================
   CONTRACT
========================================================= */

function formatContract(
    contract
) {

    const match =
        String(contract)
            .match(
                /(\d{4})-(\d{1,2})/
            );


    if (!match) {

        return contract;

    }


    return (
        match[1] +
        "年" +
        Number(match[2]) +
        "月"
    );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

    document.getElementById(
        "dataStatus"
    ).textContent =
        "読み込み中...";


    try {

        const response =
            await fetch(
                DATA_URL +
                "?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        allData =
            parseCSV(text);


        if (
            !allData.length
        ) {

            throw new Error(
                "CSVが空です"
            );

        }


        document.getElementById(
            "dataStatus"
        ).textContent =
            allData.length
                .toLocaleString() +
            " records";


        updateHeader();

        initialize();


    } catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "dataStatus"
        ).textContent =
            "読み込みエラー";


        chart.innerHTML = `

            <div class="message error">

                データを読み込めませんでした。

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* =========================================================
   UPDATE HEADER
========================================================= */

function updateHeader() {

    if (
        !allData.length
    ) {

        return;

    }


    const first =
        allData[0];


    document.getElementById(
        "qriUpdateTime"
    ).textContent =
        first.qri_update_time ||
        "---";


    document.getElementById(
        "collectedTime"
    ).textContent =
        first.collected_at ||
        "---";

}


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    const contracts =
        [
            ...new Set(
                allData
                    .map(
                        d =>
                            d.contract
                    )
                    .filter(Boolean)
            )
        ];


    contracts.sort(
        (a, b) =>
            contractSortValue(a) -
            contractSortValue(b)
    );


    contractSelect.innerHTML =
        "";


    contracts.forEach(
        contract => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                contract;


            option.textContent =
                formatContract(
                    contract
                );


            contractSelect.appendChild(
                option
            );

        }
    );


    if (
        !selectedContract ||
        !contracts.includes(
            selectedContract
        )
    ) {

        selectedContract =
            contracts[0];

    }


    contractSelect.value =
        selectedContract;


    render();

}


/* =========================================================
   CONTRACT SORT
========================================================= */

function contractSortValue(
    contract
) {

    const match =
        String(contract)
            .match(
                /(\d{4})-(\d{1,2})/
            );


    if (!match) {

        return 999999;

    }


    return (
        Number(match[1]) *
        100 +
        Number(match[2])
    );

}


/* =========================================================
   BUILD STRIKE MAP
========================================================= */

function buildStrikeMap() {

    const map =
        new Map();


    const rows =
        allData.filter(
            d =>
                d.contract ===
                selectedContract
        );


    rows.forEach(
        d => {

            const strike =
                num(d.strike);


            if (!strike) {

                return;

            }


            if (
                !map.has(strike)
            ) {

                map.set(
                    strike,
                    {
                        strike: strike,

                        callVolume: 0,

                        callOI: 0,

                        putOI: 0,

                        putVolume: 0
                    }
                );

            }


            const item =
                map.get(strike);


            const type =
                String(
                    d.option_type ||
                    ""
                )
                .trim()
                .toUpperCase();


            if (
                type === "CALL" ||
                type === "C"
            ) {

                item.callVolume =
                    num(d.volume);

                item.callOI =
                    num(
                        d.open_interest
                    );

            }


            if (
                type === "PUT" ||
                type === "P"
            ) {

                item.putVolume =
                    num(d.volume);

                item.putOI =
                    num(
                        d.open_interest
                    );

            }

        }
    );


    return [
        ...map.values()
    ];

}


/* =========================================================
   MAX PAIN
========================================================= */

function calculateMaxPain(
    rows
) {

    if (
        !rows.length
    ) {

        return null;

    }


    let bestStrike = null;

    let bestPain = Infinity;


    rows.forEach(
        candidate => {

            const settlement =
                candidate.strike;


            let pain = 0;


            rows.forEach(
                r => {

                    /*
                       CALL LOSS
                    */

                    if (
                        settlement >
                        r.strike
                    ) {

                        pain +=
                            (
                                settlement -
                                r.strike
                            ) *
                            r.callOI;

                    }


                    /*
                       PUT LOSS
                    */

                    if (
                        settlement <
                        r.strike
                    ) {

                        pain +=
                            (
                                r.strike -
                                settlement
                            ) *
                            r.putOI;

                    }

                }
            );


            if (
                pain <
                bestPain
            ) {

                bestPain =
                    pain;

                bestStrike =
                    settlement;

            }

        }
    );


    return bestStrike;

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    let rows =
        buildStrikeMap();


    if (
        !rows.length
    ) {

        chart.innerHTML = `

            <div class="message">
                データがありません。
            </div>

        `;

        return;

    }


    /* -----------------------------------------------------
       MAX PAIN
    ----------------------------------------------------- */

    maxPain =
        calculateMaxPain(
            rows
        );


    document.getElementById(
        "maxPainValue"
    ).textContent =
        maxPain !== null
            ? formatNumber(maxPain)
            : "---";


    /* -----------------------------------------------------
       TOTAL OI
    ----------------------------------------------------- */

    const totalCallOI =
        rows.reduce(
            (sum, r) =>
                sum +
                r.callOI,
            0
        );


    const totalPutOI =
        rows.reduce(
            (sum, r) =>
                sum +
                r.putOI,
            0
        );


    document.getElementById(
        "totalCallOI"
    ).textContent =
        formatNumber(
            totalCallOI
        );


    document.getElementById(
        "totalPutOI"
    ).textContent =
        formatNumber(
            totalPutOI
        );


    document.getElementById(
        "oiRatio"
    ).textContent =
        totalPutOI > 0
            ? (
                totalCallOI /
                totalPutOI
            ).toFixed(2)
            : "---";


    document.getElementById(
        "selectedContract"
    ).textContent =
        formatContract(
            selectedContract
        );


    /* -----------------------------------------------------
       STRIKE SORT
    ----------------------------------------------------- */

    rows.sort(
        (a, b) =>
            b.strike -
            a.strike
    );


    /* -----------------------------------------------------
       RANGE
    ----------------------------------------------------- */

    const range =
        rangeSelect.value;


    if (
        range !== "all"
    ) {

        const center =
            rows[
                Math.floor(
                    rows.length / 2
                )
            ].strike;


        const distance =
            range === "near2500"
                ? 2500
                : 5000;


        rows =
            rows.filter(
                r =>
                    Math.abs(
                        r.strike -
                        center
                    ) <=
                    distance
            );

    }


    /* =====================================================
       ★ 共通スケール
    ===================================================== */

    /*
       VolumeはCALL + PUTで
       一番大きい値を100%にする
    */

    const maxVolume =
        Math.max(
            1,

            ...rows.map(
                r =>
                    Math.max(
                        r.callVolume,
                        r.putVolume
                    )
            )
        );


    /*
       OIはCALL + PUTで
       一番大きい値を100%にする
    */

    const maxOI =
        Math.max(
            1,

            ...rows.map(
                r =>
                    Math.max(
                        r.callOI,
                        r.putOI
                    )
            )
        );


    chart.innerHTML = "";


    /* =====================================================
       ROW
    ===================================================== */

    rows.forEach(
        r => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "option-row";


            /* ------------------------------------------------
               MAX PAIN
            ------------------------------------------------ */

            if (
                r.strike ===
                maxPain
            ) {

                row.classList.add(
                    "max-pain-row"
                );

            }


            /* ------------------------------------------------
               共通スケールで幅を計算
            ------------------------------------------------ */

            const callVolumeWidth =
                Math.min(
                    100,

                    r.callVolume /
                    maxVolume *
                    100
                );


            const callOIWidth =
                Math.min(
                    100,

                    r.callOI /
                    maxOI *
                    100
                );


            const putOIWidth =
                Math.min(
                    100,

                    r.putOI /
                    maxOI *
                    100
                );


            const putVolumeWidth =
                Math.min(
                    100,

                    r.putVolume /
                    maxVolume *
                    100
                );


            /* ------------------------------------------------
               HTML
            ------------------------------------------------ */

            row.innerHTML = `


                <!-- ========================================
                     CALL VOLUME
                ========================================= -->

                <div
                    class="
                        bar-cell
                        call-volume
                    "
                >

                    <div class="bar-area">

                        <div
                            class="bar"
                            style="
                                width:
                                ${callVolumeWidth}%;
                            "
                        ></div>


                        <div
                            class="bar-value"
                        >
                            ${formatNumber(
                                r.callVolume
                            )}
                        </div>

                    </div>

                </div>


                <!-- ========================================
                     CALL OI
                ========================================= -->

                <div
                    class="
                        bar-cell
                        call-oi
                    "
                >

                    <div class="bar-area">

                        <div
                            class="bar"
                            style="
                                width:
                                ${callOIWidth}%;
                            "
                        ></div>


                        <div
                            class="bar-value"
                        >
                            ${formatNumber(
                                r.callOI
                            )}
                        </div>

                    </div>

                </div>


                <!-- ========================================
                     STRIKE
                ========================================= -->

                <div class="strike">

                    ${formatNumber(
                        r.strike
                    )}

                    ${
                        r.strike ===
                        maxPain
                            ? `
                                <span
                                    class="
                                        max-pain-marker
                                    "
                                >
                                    MAX
                                </span>
                              `
                            : ""
                    }

                </div>


                <!-- ========================================
                     PUT OI
                ========================================= -->

                <div
                    class="
                        bar-cell
                        put-oi
                    "
                >

                    <div class="bar-area">

                        <div
                            class="bar"
                            style="
                                width:
                                ${putOIWidth}%;
                            "
                        ></div>


                        <div
                            class="bar-value"
                        >
                            ${formatNumber(
                                r.putOI
                            )}
                        </div>

                    </div>

                </div>


                <!-- ========================================
                     PUT VOLUME
                ========================================= -->

                <div
                    class="
                        bar-cell
                        put-volume
                    "
                >

                    <div class="bar-area">

                        <div
                            class="bar"
                            style="
                                width:
                                ${putVolumeWidth}%;
                            "
                        ></div>


                        <div
                            class="bar-value"
                        >
                            ${formatNumber(
                                r.putVolume
                            )}
                        </div>

                    </div>

                </div>

            `;


            chart.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   EVENTS
========================================================= */

contractSelect.addEventListener(
    "change",
    () => {

        selectedContract =
            contractSelect.value;

        render();

    }
);


rangeSelect.addEventListener(
    "change",
    () => {

        render();

    }
);


reloadButton.addEventListener(
    "click",
    () => {

        loadData();

    }
);


/* =========================================================
   AUTO UPDATE
========================================================= */

setInterval(
    () => {

        loadData();

    },
    60 * 1000
);


/* =========================================================
   START
========================================================= */

loadData();

</script>


</body>

</html>
