<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日経225オプション需給モニター</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f8fafc;color:#111827}.header{background:#111827;color:white}.header-inner{max-width:1400px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;gap:20px}.title{font-size:20px;font-weight:700}.subtitle{font-size:10px;color:#cbd5e1;margin-top:4px}.update-info{font-size:10px;color:#cbd5e1;text-align:right}.controls,.market-info{max-width:1400px;margin:auto;padding:10px 18px}.control-box,.market-box{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.control-group{display:flex;align-items:center;gap:6px}.control-label,.market-label{font-size:10px;color:#64748b}.control-box select,.control-box button{height:30px;border:1px solid #cbd5e1;border-radius:5px;background:white;padding:0 9px;font-size:11px}.max-pain-box{margin-left:auto;padding:6px 12px;background:#fff7ed;border:1px solid #fdba74;border-radius:6px}.max-pain-label{font-size:9px;color:#9a3412;margin-right:6px}.max-pain-value{font-size:14px;font-weight:700;color:#ea580c}.market-info{padding-top:0}.market-box{gap:24px;padding:8px 0}.market-item{display:flex;align-items:baseline;gap:6px}.market-value{font-size:16px;font-weight:700}.market-small{font-size:13px}.chart-wrapper{max-width:1400px;margin:auto;padding:0 18px 20px}.chart-container{overflow-x:auto;background:white;border:1px solid #d1d5db;border-radius:6px}.chart-header,.option-row{display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;min-width:650px}.chart-header{position:sticky;top:0;z-index:20;height:34px;font-size:10px;font-weight:700;text-align:center}.chart-header>div{display:flex;align-items:center;justify-content:center}.call-header{background:#fee2e2;color:#991b1b}.strike-header{background:#f3f4f6}.put-header{background:#dbeafe;color:#1e3a8a}.option-row{height:32px;border-top:1px solid #f1f5f9}.bar-cell{padding:4px}.bar-area{height:24px;position:relative;overflow:hidden;background:#f8fafc;border-radius:2px}.bar{position:absolute;top:0;height:24px;border-radius:2px}.call-volume .bar{right:0;background:#fca5a5}.call-oi .bar{right:0;background:#dc2626}.put-oi .bar{left:0;background:#2563eb}.put-volume .bar{left:0;background:#93c5fd}.bar-value{position:absolute;top:0;height:24px;display:flex;align-items:center;z-index:3;font-size:9px;font-weight:600;white-space:nowrap}.call-volume .bar-value,.call-oi .bar-value{right:4px}.put-oi .bar-value,.put-volume .bar-value{left:4px}.call-volume .bar-value{color:#991b1b}.call-oi .bar-value,.put-oi .bar-value{color:white}.put-volume .bar-value{color:#1e3a8a}.strike{position:relative;height:32px;display:flex;align-items:center;justify-content:center;background:white;border-left:1px solid #d1d5db;border-right:1px solid #d1d5db;font-size:10px;font-weight:700}.max-pain-row{background:#fff7ed}.max-pain-row .strike{background:#ffedd5;color:#ea580c;border-top:2px solid #f97316;border-bottom:2px solid #f97316}.max-pain-marker{position:absolute;right:3px;top:1px;font-size:7px;color:#ea580c}.legend{padding:7px 12px;display:flex;flex-wrap:wrap;gap:15px;border-top:1px solid #e5e7eb;color:#6b7280;font-size:9px}.legend-item{display:flex;align-items:center;gap:4px}.legend-color{width:15px;height:8px;border-radius:2px}.legend-call-volume{background:#fca5a5}.legend-call-oi{background:#dc2626}.legend-put-oi{background:#2563eb}.legend-put-volume{background:#93c5fd}.message{padding:40px 15px;text-align:center;color:#6b7280;font-size:12px}.message.error{color:#dc2626}@media(max-width:900px){.title{font-size:17px}.subtitle,.update-info{font-size:9px}.chart-header,.option-row{grid-template-columns:120px 120px 75px 120px 120px}#chart,.chart-header{min-width:555px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div><div class="title">日経225オプション需給モニター</div><div class="subtitle">CALL Volume / CALL OI / Strike / PUT OI / PUT Volume</div></div><div class="update-info"><div>QRI更新：<span id="qriUpdateTime">---</span></div><div>データ取得：<span id="collectedTime">---</span></div><div><span id="dataStatus">読み込み中</span></div></div></div></header>
<section class="controls"><div class="control-box"><div class="control-group"><span class="control-label">限月</span><select id="contractSelect"><option>読み込み中...</option></select></div><div class="control-group"><span class="control-label">表示</span><select id="rangeSelect"><option value="all">全Strike</option><option value="near">中央±5,000</option><option value="near2500">中央±2,500</option></select></div><button id="reloadButton">↻ 更新</button><div class="max-pain-box"><span class="max-pain-label">MAX PAIN</span><span id="maxPainValue" class="max-pain-value">---</span></div></div></section>
<section class="market-info"><div class="market-box"><div class="market-item"><span class="market-label">現在値</span><span id="currentPrice" class="market-value">---</span></div><div class="market-item"><span class="market-label">選択限月</span><span id="selectedContract" class="market-value market-small">---</span></div><div class="market-item"><span class="market-label">CALL OI合計</span><span id="totalCallOI" class="market-value market-small">---</span></div><div class="market-item"><span class="market-label">PUT OI合計</span><span id="totalPutOI" class="market-value market-small">---</span></div><div class="market-item"><span class="market-label">CALL / PUT OI</span><span id="oiRatio" class="market-value market-small">---</span></div></div></section>
<main class="chart-wrapper"><div class="chart-container"><div class="chart-header"><div class="call-header">CALL Volume</div><div class="call-header">CALL OI</div><div class="strike-header">Strike</div><div class="put-header">PUT OI</div><div class="put-header">PUT Volume</div></div><div id="chart"><div class="message">データを読み込んでいます...</div></div><div class="legend"><div class="legend-item"><span class="legend-color legend-call-volume"></span>CALL Volume</div><div class="legend-item"><span class="legend-color legend-call-oi"></span>CALL OI</div><div class="legend-item"><span class="legend-color legend-put-oi"></span>PUT OI</div><div class="legend-item"><span class="legend-color legend-put-volume"></span>PUT Volume</div><div class="legend-item">🟧 Max Pain</div></div></div></main>
<script>
const DATA_URL="https://raw.githubusercontent.com/uro-o/jpx-option-data-realtime-html/main/data/latest.csv";
let allData=[];let selectedContract="";let maxPain=null;
const chart=document.getElementById("chart"),contractSelect=document.getElementById("contractSelect"),rangeSelect=document.getElementById("rangeSelect"),reloadButton=document.getElementById("reloadButton");
function parseCSV(text){const rows=[];let row=[],value="",insideQuotes=false;for(let i=0;i<text.length;i++){const char=text[i],next=text[i+1];if(char==='"'&&next==='"'){value+='"';i++;continue}if(char==='"'){insideQuotes=!insideQuotes;continue}if(char===','&&!insideQuotes){row.push(value);value="";continue}if((char==='\n'||char==='\r')&&!insideQuotes){if(char==='\r'&&next==='\n')i++;row.push(value);if(row.some(v=>v!==""))rows.push(row);row=[];value="";continue}value+=char}if(value!==""||row.length>0){row.push(value);rows.push(row)}if(!rows.length)return[];const headers=rows[0].map(h=>h.trim());return rows.slice(1).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]!==undefined?r[i].trim():"");return o})}
function num(value){if(value===null||value===undefined||value==="")return 0;const n=Number(String(value).replace(/,/g,"").trim());return Number.isFinite(n)?n:0}
function formatNumber(value){return Math.round(value).toLocaleString("ja-JP")}
function formatContract(contract){const m=String(contract).match(/(\d{4})-(\d{1,2})/);return m?`${m[1]}年${Number(m[2])}月`:contract}

/* =========================================================
   EXPIRY CHECK
   日経225オプションの月次限月はSQ日＝第2金曜日。
   取引最終日はSQ日の前営業日として扱う。
   土日を除いて判定し、祝日の場合も安全側に前倒しする。
========================================================= */
function getSecondFriday(year,month){const first=new Date(year,month-1,1);const firstDay=first.getDay();const daysToFriday=(5-firstDay+7)%7;return new Date(year,month-1,1+daysToFriday+7)}
function getLastTradingDay(year,month){const sq=getSecondFriday(year,month);const d=new Date(sq);d.setDate(d.getDate()-1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d}
function contractLastTradingDay(contract){const m=String(contract).match(/^(\d{4})-(\d{1,2})$/);if(!m)return null;return getLastTradingDay(Number(m[1]),Number(m[2]))}
function isExpiredContract(contract){const last=contractLastTradingDay(contract);if(!last)return false;const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());return last<today}
function getActiveContracts(){return [...new Set(allData.map(d=>d.contract).filter(Boolean))].filter(c=>!isExpiredContract(c))}

function loadData(){document.getElementById("dataStatus").textContent="読み込み中...";fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(text=>{allData=parseCSV(text);if(!allData.length)throw new Error("CSVが空です");const expired=[...new Set(allData.map(d=>d.contract).filter(Boolean))].filter(isExpiredContract);document.getElementById("dataStatus").textContent=(allData.length-expired.reduce((n,c)=>n+allData.filter(d=>d.contract===c).length,0)).toLocaleString()+" records"+(expired.length?" / 期限切れ除外: "+expired.map(formatContract).join(", "):"");updateHeader();initialize()}).catch(error=>{console.error(error);document.getElementById("dataStatus").textContent="読み込みエラー";chart.innerHTML=`<div class="message error">データを読み込めませんでした。<br><br>${error.message}</div>`})}
function updateHeader(){if(!allData.length)return;const active=allData.filter(d=>!isExpiredContract(d.contract));const first=active[0]||allData[0];document.getElementById("qriUpdateTime").textContent=first.qri_update_time||"---";document.getElementById("collectedTime").textContent=first.collected_at||"---"}
function initialize(){const contracts=getActiveContracts();contracts.sort((a,b)=>contractSortValue(a)-contractSortValue(b));contractSelect.innerHTML="";contracts.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=formatContract(c);contractSelect.appendChild(o)});if(!selectedContract||!contracts.includes(selectedContract))selectedContract=contracts[0]||"";contractSelect.value=selectedContract;render()}
function contractSortValue(contract){const m=String(contract).match(/(\d{4})-(\d{1,2})/);return m?Number(m[1])*100+Number(m[2]):999999}
function buildStrikeMap(){const map=new Map();const rows=allData.filter(d=>d.contract===selectedContract&&!isExpiredContract(d.contract));rows.forEach(d=>{const strike=num(d.strike);if(!strike)return;if(!map.has(strike))map.set(strike,{strike,callVolume:0,callOI:0,putOI:0,putVolume:0});const item=map.get(strike),type=String(d.option_type||"").trim().toUpperCase();if(type==="CALL"||type==="C"){item.callVolume=num(d.volume);item.callOI=num(d.open_interest)}if(type==="PUT"||type==="P"){item.putVolume=num(d.volume);item.putOI=num(d.open_interest)}});return[...map.values()]}
function calculateMaxPain(rows){if(!rows.length)return null;let bestStrike=null,bestPain=Infinity;rows.forEach(candidate=>{const settlement=candidate.strike;let pain=0;rows.forEach(r=>{if(settlement>r.strike)pain+=(settlement-r.strike)*r.callOI;if(settlement<r.strike)pain+=(r.strike-settlement)*r.putOI});if(pain<bestPain){bestPain=pain;bestStrike=settlement}});return bestStrike}
function render(){let rows=buildStrikeMap();if(!rows.length){chart.innerHTML='<div class="message">データがありません。</div>';document.getElementById("maxPainValue").textContent="---";return}maxPain=calculateMaxPain(rows);document.getElementById("maxPainValue").textContent=maxPain!==null?formatNumber(maxPain):"---";const totalCallOI=rows.reduce((s,r)=>s+r.callOI,0),totalPutOI=rows.reduce((s,r)=>s+r.putOI,0);document.getElementById("totalCallOI").textContent=formatNumber(totalCallOI);document.getElementById("totalPutOI").textContent=formatNumber(totalPutOI);document.getElementById("oiRatio").textContent=totalPutOI>0?(totalCallOI/totalPutOI).toFixed(2):"---";document.getElementById("selectedContract").textContent=formatContract(selectedContract);rows.sort((a,b)=>b.strike-a.strike);const range=rangeSelect.value;if(range!=="all"){const center=rows[Math.floor(rows.length/2)].strike;const distance=range==="near2500"?2500:5000;rows=rows.filter(r=>Math.abs(r.strike-center)<=distance)}const maxVolume=Math.max(1,...rows.map(r=>Math.max(r.callVolume,r.putVolume)));const maxOI=Math.max(1,...rows.map(r=>Math.max(r.callOI,r.putOI)));chart.innerHTML="";rows.forEach(r=>{const row=document.createElement("div");row.className="option-row";if(r.strike===maxPain)row.classList.add("max-pain-row");const cv=Math.min(100,r.callVolume/maxVolume*100),co=Math.min(100,r.callOI/maxOI*100),po=Math.min(100,r.putOI/maxOI*100),pv=Math.min(100,r.putVolume/maxVolume*100);row.innerHTML=`<div class="bar-cell call-volume"><div class="bar-area"><div class="bar" style="width:${cv}%"></div><div class="bar-value">${formatNumber(r.callVolume)}</div></div></div><div class="bar-cell call-oi"><div class="bar-area"><div class="bar" style="width:${co}%"></div><div class="bar-value">${formatNumber(r.callOI)}</div></div></div><div class="strike">${formatNumber(r.strike)}${r.strike===maxPain?'<span class="max-pain-marker">MAX</span>':''}</div><div class="bar-cell put-oi"><div class="bar-area"><div class="bar" style="width:${po}%"></div><div class="bar-value">${formatNumber(r.putOI)}</div></div></div><div class="bar-cell put-volume"><div class="bar-area"><div class="bar" style="width:${pv}%"></div><div class="bar-value">${formatNumber(r.putVolume)}</div></div></div>`;chart.appendChild(row)})}
contractSelect.addEventListener("change",()=>{selectedContract=contractSelect.value;render()});rangeSelect.addEventListener("change",render);reloadButton.addEventListener("click",loadData);setInterval(loadData,60000);loadData();
</script>
</body>
</html>
